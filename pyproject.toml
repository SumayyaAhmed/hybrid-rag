[project]
name = "rag"
version = "0.1.0"
description = "Hybrid RAG for e-commerce: pgvector + BM25 (pg_textsearch), Voyage embeddings/rerank, Gemini answers"
authors = [
    { name = "Sumayya Ahmed", email = "sumayya.ahmed@ebitlogix.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.34.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=1.28.2",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "voyageai>=0.5.0",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# This Mac is Intel (x86_64). Newer releases of some packages (onnxruntime, cryptography,
# pymupdf) no longer ship Intel-Mac wheels, so uv would try to compile them from source.
# These two settings make uv pick the newest versions that have a prebuilt wheel for this machine.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
no-build = true

[tool.ruff]
line-length = 150          # fits the existing code; the point is catching mistakes, not reformatting

[tool.ruff.lint]
select = ["E", "F", "W"]   # pycodestyle errors/warnings + pyflakes (unused imports, undefined names, …)

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_data.py" = ["E501"]   # long sample-data strings read better unsplit

[tool.pytest.ini_options]
markers = ["db: needs Postgres (rag_test database); run with `make test-db`"]

[tool.fastapi]
entrypoint = "rag.api.main:app"   # `fastapi dev` / `fastapi run` find the app from this (spec 10)
