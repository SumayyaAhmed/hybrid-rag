services:
  db:
    build: ./db                                     # pgvector/pgvector:pg18 + pg_textsearch, see db/Dockerfile
    image: hybrid-rag-db:pg18-bm25
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]   # pg_textsearch must be preloaded
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql                  # PG18 moved the data dir; mount here, not .../data
    # schema is managed by Alembic (db/migrations), not by init scripts: run `make migrate`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      retries: 15

  # The Python app (chat, rag CLI, alembic). Interactive, so it is started with `docker compose run`, not `up`.
  # See specs/08-app-container.md. Usage: make app-chat / make app-cli ARGS="stats"
  app:
    build: .
    image: hybrid-rag-app
    profiles: ["app"]                               # `make up` still starts only db
    env_file:                                       # API keys + knobs, read at runtime (never baked into the image)
      - path: .env
        required: false                             # CI has no .env and only builds the image
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag   # "db" = service name; overrides localhost from .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./eval:/app/eval                            # eval results written in the container land in the project
    stdin_open: true                                # chat loop reads from the keyboard
    tty: true

  # The HTTP API (FastAPI, spec 10). No profile: `make up` starts it with db. Docs: http://localhost:8000/docs
  api:
    build: .
    image: hybrid-rag-app                           # same image as app, different command
    command: ["fastapi", "run", "--port", "8000"]   # exec form, so lifespan shutdown runs (FastAPI Docker docs)
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    ports: ["127.0.0.1:8000:8000"]                  # localhost only: there is no auth yet
    depends_on:
      db:
        condition: service_healthy
    healthcheck:                                    # slim image has no curl, so ask Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
